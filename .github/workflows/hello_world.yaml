name: Hello World Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: list the files with checkout
        run: ls
        shell: bash

  goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: list the files without checkout
        run: ls
        shell: bash
